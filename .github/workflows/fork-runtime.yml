name: Fork Runtime Artifacts

# Repository Actions are disabled. Enable and dispatch only on the owner's request.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag used to pin all internal package downloads
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:server
      - run: npm run build:daemon-web-ui
      - name: Pack fork packages
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: npm run package:fork-runtime -- "$RELEASE_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paseo-fork-runtime
          path: artifacts/fork-runtime/
