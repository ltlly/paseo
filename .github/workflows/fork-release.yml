name: Fork Release

on:
  push:
    tags:
      - "v*-ltlly.*"
  release:
    types: [published]

concurrency:
  group: fork-release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SOURCE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
  ONNXRUNTIME_NODE_INSTALL: skip
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  prepare:
    if: github.repository == 'ltlly/paseo' && contains(github.event.release.tag_name || github.ref_name, '-ltlly.')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      build: ${{ steps.release.outputs.build }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_TAG }}
      - id: release
        name: Validate immutable source and avoid duplicate publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-ltlly\.[1-9][0-9]*$ ]]
          version="$(node -p 'require("./package.json").version')"
          [[ "$SOURCE_TAG" == "v$version" ]]
          commit="$(git rev-parse HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          if gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --pattern release-manifest.json --dir "$RUNNER_TEMP" 2>/dev/null; then
            RELEASE_COMMIT="$commit" node -e 'const m=require(process.env.RUNNER_TEMP+"/release-manifest.json");if(m.commit!==process.env.RELEASE_COMMIT||m.tag!==process.env.SOURCE_TAG)throw Error("Published tag source mismatch")'
            if [[ "$(gh release view "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" == false ]]; then
              echo 'build=false' >> "$GITHUB_OUTPUT"
            else
              echo 'build=true' >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
            if gh release view "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release edit "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --draft --latest=false
            fi
          fi

  verify:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: node scripts/npm-retry.mjs ci
      - run: npm run build:server && npm run build:app-deps
      - run: npm run typecheck
      - run: npm run lint
      - run: node --test scripts/release-version-utils.test.mjs scripts/fork-release.test.mjs
      - run: npx vitest run packages/protocol/src/fork-release.test.ts packages/server/src/server/session/daemon/daemon-self-updater.test.ts packages/server/src/server/session/daemon/npm-global-cli.test.ts packages/desktop/src/features/auto-updater.test.ts packages/desktop/src/features/app-update-service.test.ts
      - working-directory: packages/app
        run: npx vitest run native-release-version.test.ts src/updates/android-update.test.ts src/updates/fork-package-update.test.ts src/desktop/updates/desktop-updates.test.ts
      - run: npx playwright install --with-deps chromium --only-shell
      - working-directory: packages/app
        run: npx vitest run src/terminal/runtime/terminal-emulator-runtime.browser.test.ts src/terminal/runtime/terminal-emulator-runtime.test.ts

  runtime:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: node scripts/npm-retry.mjs ci
      - run: npm run build:server && npm run build:daemon-web-ui
      - run: npm run package:fork-runtime -- "$SOURCE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: runtime
          path: artifacts/fork-runtime/
          compression-level: 0
          retention-days: 7

  desktop:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ${{ vars.FORK_MACOS_ARM_RUNNER || 'macos-26' }}
            platform: macos-arm64
            flags: --mac --arm64 -c.mac.identity=- -c.mac.notarize=false -c.mac.hardenedRuntime=false
          - runner: macos-15-intel
            platform: macos-x64
            flags: --mac --x64 -c.mac.identity=- -c.mac.notarize=false -c.mac.hardenedRuntime=false
          - runner: windows-latest
            platform: windows
            flags: --win --x64 --arm64
          - runner: ubuntu-24.04
            platform: linux-x64
            flags: --linux --x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      PASEO_DESKTOP_SMOKE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Linux packaging and smoke dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth rpm libfuse2
      - run: node scripts/npm-retry.mjs ci
      - name: Build installers and updater manifests
        shell: bash
        env:
          BUILD_FLAGS: ${{ matrix.flags }}
          PASEO_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/desktop-smoke
        run: npm run build:desktop -- --publish never $BUILD_FLAGS
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/*.exe
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb
            packages/desktop/release/*.rpm
            packages/desktop/release/*.tar.gz
            packages/desktop/release/*.blockmap
            packages/desktop/release/latest*.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-${{ matrix.platform }}
          path: ${{ runner.temp }}/desktop-smoke
          if-no-files-found: ignore
          retention-days: 7

  android:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [arm64, universal]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_TAG }}
      - name: Free space for native Android builds
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/share/boost
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'
      - run: node scripts/npm-retry.mjs ci
      - name: Build the complete embedded-font APK
        env:
          APK_TARGET: ${{ matrix.target }}
        run: node scripts/build-apk.mjs "$APK_TARGET"
      - name: Sign with the existing fork Android identity
        env:
          KEYSTORE_BASE64: ${{ secrets.FORK_ANDROID_KEYSTORE_BASE64 }}
          FORK_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FORK_ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          APK_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$FORK_ANDROID_KEYSTORE_PASSWORD"
          node -e 'require("fs").writeFileSync(process.env.RUNNER_TEMP+"/fork-android.jks",Buffer.from(process.env.KEYSTORE_BASE64,"base64"),{mode:0o600})'
          mkdir -p artifacts/release
          apk="artifacts/release/Paseo-${RELEASE_VERSION}-${APK_TARGET}.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/fork-android.jks" --ks-key-alias paseo-fork --ks-pass env:FORK_ANDROID_KEYSTORE_PASSWORD --out "$apk" "artifacts/paseo-dogfood-${APK_TARGET}.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | sed -n '1p'
          rm "$RUNNER_TEMP/fork-android.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.target }}
          path: artifacts/release/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [prepare, verify, runtime, desktop, android]
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --prefix "$RUNNER_TEMP/release-tools" --ignore-scripts --no-audit --no-fund js-yaml@4.1.1
      - name: Install only release-script dependency
        run: mkdir -p node_modules && ln -s "$RUNNER_TEMP/release-tools/node_modules/js-yaml" node_modules/js-yaml
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/ci
      - name: Validate complete release and assemble checksums
        env:
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: node scripts/assemble-fork-release.mjs artifacts/ci artifacts/release "$SOURCE_TAG" "$RELEASE_COMMIT"
      - name: Publish only after every build and validation passes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$SOURCE_TAG" --notes-file artifacts/release-notes.md
          fi
          files=()
          for file in artifacts/release/*; do
            [[ "$file" == */release-manifest.json ]] || files+=("$file")
          done
          gh release upload "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" "${files[@]}" --clobber
          gh release upload "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" artifacts/release/release-manifest.json --clobber
          gh release edit "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --title "$SOURCE_TAG" --notes-file artifacts/release-notes.md --draft=false --prerelease=false --latest
