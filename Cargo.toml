[workspace]
members = ["packages/desktop/native"]
exclude = ["packages/desktop/native/vendor/vte"]
resolver = "2"

[patch.crates-io]
# vte 0.15.0 can discard valid text across PTY reads. Keep the fix in the parser
# until its upstream release includes it; provenance is beside the vendored source.
vte = { path = "packages/desktop/native/vendor/vte" }

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[profile.dev]
debug = 1

[profile.dev.package.gpui]
opt-level = 2

[profile.release]
lto = "thin"
strip = "symbols"

