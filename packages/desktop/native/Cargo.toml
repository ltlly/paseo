[package]
name = "paseo-desktop"
version = "0.14.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
default-run = "paseo-desktop"

[features]
default = ["desktop"]
desktop = ["dep:gpui", "dep:gpui_platform"]
runtime-shaders = ["gpui_platform/runtime_shaders"]

[dependencies]
alacritty_terminal = { version = "=0.26.0", default-features = false }
anyhow = "1.0"
async-channel = "2.5"
gpui = { version = "=0.2.2", git = "https://github.com/zed-industries/zed", rev = "c4273271092b0287f7d181f616bd5171e0a2f70c", default-features = false, optional = true }
gpui_platform = { version = "=0.1.0", git = "https://github.com/zed-industries/zed", rev = "c4273271092b0287f7d181f616bd5171e0a2f70c", features = [
  "font-kit",
  "wayland",
  "x11",
], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
uuid = { version = "1.18", features = ["v4"] }

[[bin]]
name = "paseo-desktop"
path = "src/main.rs"
required-features = ["desktop"]

